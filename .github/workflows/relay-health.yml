name: Check sharing relay health

on:
  schedule:
    # Nominal gaps: 14 minutes, except 4 across the hour. GitHub can delay jobs.
    - cron: '3,17,31,45,59 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharing-relay-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the public relay
        env:
          PUNTO_SHARING_API_URL: ${{ vars.PUNTO_SHARING_API_URL }}
        run: python -B scripts/check_relay_health.py
