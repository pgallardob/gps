name: Verify Android background sharing

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'scripts/check_android_trace.py'
      - 'scripts/annotate_android_failure.py'
      - 'scripts/verify_android_emulator.sh'
      - 'postman/mocks/sharing-relay/**'
      - 'postman/simulations/sharing-start.sim.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic
          cache-read-only: false
          dependency-graph: disabled
          build-scan-publish: false
      - name: Install the compile platform on the disposable runner
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Compile, unit-test and lint
        run: |
          set -o pipefail
          gradle -p mobile/android --no-daemon --console=plain testLiveDebugUnitTest lintLiveDebug assembleLiveDebug assembleSimulationDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Install the local-only simulation CLI
        run: npm install --global postman-cli@1.75.0
      - name: Enable hardware acceleration on the disposable runner
        run: sudo chmod 666 /dev/kvm
      - name: Test native sharing with the screen off and notification Stop
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify_android_emulator.sh
      - name: Publish sanitized failure annotations
        if: failure()
        run: python scripts/annotate_android_failure.py
      - name: Upload only the live-endpoint preview APK after all checks pass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: punto-android-preview
          path: mobile/android/app/build/outputs/apk/live/debug/app-live-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Keep synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-relay.ndjson
            ${{ runner.temp }}/android-relay.err
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-connected.log
            ${{ runner.temp }}/android-trace-check.log
          if-no-files-found: ignore
          retention-days: 3
